<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/Artilleriethur/betty-mathe@main/betty.min.js"></script>
</head>
<body>
<script>
const CONFIG = {
  titel: "Gleichung mit Klammer lösen",
  auftrag: "Rechne Schritt für Schritt. Wenn du hängst, hilft der Tipp. Deine eigene Aufgabe kommt im letzten Schritt.",
  schritte: [
    { titel: "Die Klammer auflösen",
      text: "Beispiel: $4(x - 3) = 2x + 6$. Die 4 vor der Klammer wird mit jedem Teil in der Klammer multipliziert.",
      frage: { frage: "Was steht links nach dem Auflösen?", antwort: "4x-12", tipp: "Rechne $4 · x$ und $4 · (-3)$.", weg: "$4(x - 3) = 4x - 12$",
        fehler: [{ antwort: "4x-3", text: "Die 4 gilt für beide Teile in der Klammer, also auch für die −3." }] } },
    { titel: "Die x auf eine Seite bringen",
      text: "Jetzt steht da $4x - 12 = 2x + 6$. Damit die x nur noch links stehen, rechnest du auf beiden Seiten $-2x$.",
      frage: { frage: "Welche Gleichung steht nach $| -2x$ da?", antwort: "2x-12=6", tipp: "Links: $4x - 2x$. Rechts bleibt nur die 6.", weg: "$4x - 12 = 2x + 6 \\quad | -2x$<br>$2x - 12 = 6$" } },
    { titel: "Nach x auflösen",
      text: "Noch zwei Umformungen: erst $| +12$, dann $| :2$.",
      frage: { frage: "Was ist x?", antwort: "9", tipp: "Nach $| +12$ steht da $2x = 18$.", weg: "$2x = 18 \\quad | :2$<br>$x = 9$<br>Probe: $4(9 - 3) = 24$ und $2 · 9 + 6 = 24$ (w. A.)" } },
    { titel: "Jetzt deine Aufgabe",
      text: "Löse genauso: $3(x - 2) = 2x + 5$. Schreib die Zwischenschritte auf dein Blatt.",
      frage: { frage: "Was ist x?", antwort: "11", tipp: "Erst die Klammer: $3x - 6$. Dann $| -2x$." } },
  ],
};
if (window.Betty) Betty.lernschritte(CONFIG);
else document.body.innerHTML = "<p style='font:16px system-ui;padding:16px'>Diese Seite braucht Internet, um den Mathe-Baukasten zu laden. Bitte später noch einmal öffnen.</p>";
</script>
</body>
</html>
