<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/Artilleriethur/betty-mathe@1/betty.min.js"></script>
</head>
<body>
<script>
const CONFIG = {
  titel: "Fläche unter dem Graphen annähern",
  auftrag: "Erhöhe die Anzahl n der Rechtecke. Wie verändern sich Untersumme und Obersumme, und welchem Wert kommen beide näher?",
  ansicht: { xMin: -0.5, xMax: 3.5, yMin: -0.5, yMax: 5.5, gleicheEinheiten: false },
  parameter: [{ name: "n", anzeige: "Anzahl der Rechtecke n", min: 1, max: 60, schritt: 1, start: 4 }],
  funktionen: [{ f: x => 0.5 * x * x + 0.5, farbe: "var(--f1)", term: () => "f(x) = 0,5x² + 0,5 auf [0; 3]" }],
  hintergrund: (g, p) => {
    const f = x => 0.5 * x * x + 0.5, a = 0, b = 3, dx = (b - a) / p.n;
    for (let i = 0; i < p.n; i++) {
      const l = a + i * dx;
      g.rechteck(l, 0, l + dx, f(l), { farbe: "var(--f3)", deckkraft: 0.35, rand: "var(--f3)" });
      g.rechteck(l, f(l), l + dx, f(l + dx), { farbe: "var(--f2)", deckkraft: 0.25 });
    }
  },
  anzeige: p => {
    const f = x => 0.5 * x * x + 0.5, dx = 3 / p.n; let U = 0, O = 0;
    for (let i = 0; i < p.n; i++) { U += f(i * dx) * dx; O += f((i + 1) * dx) * dx; }
    return [["Untersumme (grün)", z(U, 3)], ["Obersumme (grün + orange)", z(O, 3)], ["Unterschied", z(O - U, 3)]];
  },
};
if (window.Betty) Betty.funktionen(CONFIG);
else document.body.innerHTML = "<p style='font:16px system-ui;padding:16px'>Diese Seite braucht Internet, um den Mathe-Baukasten zu laden. Bitte später noch einmal öffnen.</p>";
</script>
</body>
</html>
